name: spendwise
description: "SpendWise — Offline-First Smart Expense & Budget Analytics Manager built with Flutter and Provider"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # State Management
  provider: ^6.1.2
  # SQLite Local Storage
  sqflite: ^2.3.3+1
  path: ^1.9.0
  # Networking
  http: ^1.2.1
  # Helpers & Charts
  intl: ^0.19.0
  fl_chart: ^0.66.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
